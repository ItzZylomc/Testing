# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# =========================================================================
# IMPORTANT - READ THIS BEFORE BUILDING
# =========================================================================
# The four values below (loader_version, yarn_mappings, fabric_version,
# loom_version) drift constantly as Fabric ships new builds. The values
# here were the latest publicly published ones for 1.21.11 as of writing,
# but you should double check them yourself before building:
#
#   1. Go to https://fabricmc.net/develop
#   2. Select Minecraft version "1.21.11"
#   3. Copy the exact "Yarn", "Fabric Loader", and "Fabric API" version
#      strings shown there into the fields below.
#
# This takes 30 seconds and will save you a failed build if a newer
# build has shipped since this file was written.
# =========================================================================

# Minecraft + mapping versions
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.1
loader_version=0.18.5

# Fabric Loom (the Gradle plugin itself)
loom_version=1.11-SNAPSHOT

# Mod metadata
mod_version=1.0.0
maven_group=com.hotbarmod
archives_base_name=hotbarmod

# Dependencies
fabric_version=0.141.5+1.21.11
